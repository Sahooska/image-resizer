<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamPhoto Studio | Smart Image Resizer & Compressor</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Background Animated Gradient Spheres -->
  <div class="bg-gradient-circle circle-1"></div>
  <div class="bg-gradient-circle circle-2"></div>

  <div class="app-card">
    
    <!-- Top Bar -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        </div>
        <div>
          <h1 class="gradient-text">ExamPhoto Studio</h1>
          <p class="subtitle">Quick Dimension &amp; File Size Optimizer for Govt Aspirants</p>
        </div>
      </div>
      <button id="soundToggle" class="sound-chip" data-hover title="Toggle Audio Feedback">
        <span class="sound-dot"></span> SFX: <span id="soundStatus">ACTIVE</span>
      </button>
    </header>

    <div class="content-grid">
      
      <!-- Left Column: Upload & Live Display -->
      <section class="visual-panel">
        <div class="drop-surface" id="dropArea" data-hover>
          <input type="file" id="fileInput" accept="image/jpeg, image/png, image/jpg" hidden>
          
          <div id="uploadPrompt" class="prompt-content">
            <div class="floating-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
            </div>
            <h3>Upload Photo or Signature</h3>
            <p>Drag and drop image here or click to browse</p>
            <span class="badge">JPG, JPEG, PNG</span>
          </div>

          <div id="imageFrame" class="image-frame" style="display: none;">
            <img id="previewImg" alt="Preview Result">
          </div>
        </div>

        <!-- Real-Time Metrics -->
        <div class="metrics-grid" id="metricsPanel" style="display: none;">
          <div class="metric-card">
            <span class="label">Original Size</span>
            <strong id="origSize">--</strong>
          </div>
          <div class="metric-card">
            <span class="label">Dimensions</span>
            <strong id="origDim">--</strong>
          </div>
          <div class="metric-card accent">
            <span class="label">Target Status</span>
            <strong id="outputStatus">Ready</strong>
          </div>
        </div>
      </section>

      <!-- Right Column: Configurations -->
      <section class="controls-panel">
        
        <!-- Preset Dropdown -->
        <div class="field-box">
          <label class="field-label">Exam Preset Template</label>
          <select id="presetSelect" class="styled-select" data-hover>
            <option value="custom">Custom Dimensions</option>
            <option value="ssc_photo">SSC CGL / CHSL / MTS Photo (20-50 KB | 200x230 px)</option>
            <option value="ssc_sign">SSC Signature (10-20 KB | 140x60 px)</option>
            <option value="ibps_photo">IBPS / SBI Bank PO/Clerk Photo (20-50 KB | 200x230 px)</option>
            <option value="ibps_sign">IBPS / SBI Bank Signature (10-20 KB | 140x60 px)</option>
            <option value="upsc_photo">UPSC Civil Services Photo (20-100 KB | 350x350 px)</option>
            <option value="rrb_photo">Railway RRB Photo (20-50 KB | 240x320 px)</option>
          </select>
        </div>

        <!-- Dimensions -->
        <div class="dual-fields">
          <div class="field-box">
            <label class="field-label">Width (px)</label>
            <input type="number" id="imgWidth" class="styled-input" placeholder="200" data-hover>
          </div>
          <div class="field-box">
            <label class="field-label">Height (px)</label>
            <input type="number" id="imgHeight" class="styled-input" placeholder="230" data-hover>
          </div>
        </div>

        <!-- Target Size & Aspect Ratio -->
        <div class="dual-fields align-end">
          <div class="field-box">
            <label class="field-label">Max Target Limit (KB)</label>
            <input type="number" id="targetKB" class="styled-input" value="50" placeholder="50" data-hover>
          </div>
          <div class="checkbox-container">
            <label class="toggle-control" data-hover>
              <input type="checkbox" id="aspectRatio" checked>
              <span class="toggle-slider"></span>
              <span class="toggle-text">Lock Ratio</span>
            </label>
          </div>
        </div>

        <!-- Filter & Adjustment Toolkit -->
        <div class="toolkit-panel">
          <div class="toolkit-header">
            <span>Visual Enhancements</span>
            <button id="resetAdjustBtn" class="reset-link" data-hover>Reset</button>
          </div>

          <div class="sliders-wrap">
            <div class="slider-item">
              <div class="slider-labels">
                <span>Brightness</span>
                <span id="brightVal">100%</span>
              </div>
              <input type="range" id="brightness" min="60" max="150" value="100" class="gradient-slider">
            </div>
            <div class="slider-item">
              <div class="slider-labels">
                <span>Contrast</span>
                <span id="contrastVal">100%</span>
              </div>
              <input type="range" id="contrast" min="60" max="170" value="100" class="gradient-slider">
            </div>
          </div>

          <div class="chips-group">
            <button id="cleanSignBtn" class="action-chip" data-hover>
              ✨ Clean Signature Background
            </button>
            <button id="rotateBtn" class="action-chip" data-hover>
              ⟳ Rotate 90°
            </button>
          </div>
        </div>

        <!-- Master Trigger Buttons -->
        <div class="action-bar">
          <button id="processBtn" class="btn btn-primary" data-hover>
            Compress &amp; Process
          </button>
          <button id="downloadBtn" class="btn btn-download" disabled data-hover>
            Download JPEG
          </button>
        </div>

      </section>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
